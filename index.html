<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#2A6C8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BKC</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%232A6C8F'/%3E%3Ccircle cx='12' cy='12' r='8' fill='%23F0C927'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --surface2:#E6EBE5; --ink:#16201B; --muted:#62716A; --line:#D5DCD5;
  --court:#2A6C8F; --court-soft:#DDEAF1; --on-court:#FFFFFF;
  --ball:#F0C927; --ball-soft:#FBF1C2; --on-ball:#2B2300;
  --good:#2E7D4F; --good-soft:#DCEFE2; --bad:#B5452E; --bad-soft:#F6DDD6;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 8px 24px rgba(22,32,27,.06);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101714; --surface:#1A231F; --surface2:#242F29; --ink:#E7ECE7; --muted:#9AA79F; --line:#2F3B35;
    --court:#5AA3C9; --court-soft:#1B3442; --on-court:#0B1A22;
    --ball:#E9C425; --ball-soft:#3A3410; --on-ball:#FFF6C7;
    --good:#5DBF85; --good-soft:#1C3527; --bad:#E27C66; --bad-soft:#3F211B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#1A231F; --surface2:#242F29; --ink:#E7ECE7; --muted:#9AA79F; --line:#2F3B35;
  --court:#5AA3C9; --court-soft:#1B3442; --on-court:#0B1A22;
  --ball:#E9C425; --ball-soft:#3A3410; --on-ball:#FFF6C7;
  --good:#5DBF85; --good-soft:#1C3527; --bad:#E27C66; --bad-soft:#3F211B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:700;letter-spacing:.01em;line-height:1}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
.num{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--court);color:var(--on-court)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top .brand svg{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.18);color:inherit;white-space:nowrap}
.banner{background:var(--ball-soft);color:var(--on-ball);font-size:14px;padding:8px 14px;text-align:center}
main{padding-top:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
section.card.flat{background:transparent;border:0;padding:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:600;line-height:1.1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
button.primary{background:var(--court);border-color:var(--court);color:var(--on-court)}
button.accent{background:var(--ball);border-color:var(--ball);color:var(--on-ball)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=date],input[type=number],select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
input[type=number]{font-family:"Barlow Condensed",Arial,sans-serif;font-size:22px;text-align:center}
label.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:10px 4px 8px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--court)}
/* roster picker */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick label{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
.pick label:has(input:checked){background:var(--court-soft);border-color:var(--court)}
.pick input{width:18px;height:18px;accent-color:var(--court);margin:0}
/* games */
.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--court);border-radius:999px}
.game{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:12px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%;font-weight:500}
.game .n{font-size:22px;font-weight:700;color:var(--muted)}
.game .teams{display:grid;gap:3px;min-width:0}
.game .team{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.game .vs{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.game .score{font-size:26px;font-weight:700;display:grid;justify-items:end;line-height:1.05}
.game .score .enter{font-size:13px;color:var(--court);font-weight:600}
.game.done{background:var(--surface2);border-color:transparent}
.game.done .win{font-weight:700}
.game.done .lose{color:var(--muted)}
.game.next{border-color:var(--ball);box-shadow:0 0 0 3px var(--ball-soft)}
.game.next .n{color:var(--on-ball);background:var(--ball);border-radius:8px;text-align:center;line-height:34px;height:34px;width:34px;font-size:18px}
.game.void{opacity:.55;text-decoration:line-through}
.sit{font-size:13px;color:var(--muted);padding:2px 10px 8px 58px}
.sit b{color:var(--ink);font-weight:600}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl th.l,.tbl td.l{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl .rank{color:var(--muted);width:28px}
.tbl .name{font-weight:600}
.tbl .big{font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:700}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.delta{font-size:13px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);vertical-align:middle;margin-left:4px}
.tag.mvp{background:var(--ball);color:var(--on-ball)}
.spark{width:64px;height:20px;vertical-align:middle}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);max-height:92vh;overflow:auto}
.scorepad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.side{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.side.win{border-color:var(--good);background:var(--good-soft)}
.side .who{font-weight:600;font-size:15px;min-height:2.6em;display:grid;align-content:center}
.side .val{font-size:56px;font-weight:700;line-height:1;font-family:"Barlow Condensed",Arial,sans-serif}
.side .ctl{display:flex;gap:8px}
.side .ctl button{width:48px;height:44px;font-size:22px;padding:0}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.quick button{padding:6px 10px;font-size:14px;min-width:38px}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:1.4em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .grow{flex:1}
.plist{display:grid;gap:8px}
.plist .p{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.plist .p.off{opacity:.55}
.plist input[type=text]{padding:6px 8px}
details.hist{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px}
details.hist summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none;font-weight:600}
details.hist summary::-webkit-details-marker{display:none}
details.hist .body{padding:0 14px 14px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
.legend{display:grid;gap:6px;font-size:14px}
.legend p{margin:0}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .game{transition:box-shadow .15s} }
@media (max-width:420px){ .game .score{font-size:22px} .side .val{font-size:46px} }

/* events */
.evt{display:grid;gap:4px}
.evt .when{font-family:"Barlow Condensed",Arial,sans-serif;font-size:26px;font-weight:700;line-height:1.05}
.evt .where{color:var(--muted)}
.count{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap;flex-shrink:0;margin-left:10px;font-family:"Barlow Condensed",Arial,sans-serif;font-size:30px;font-weight:700;line-height:1}
.count small{font-size:13px;font-family:Barlow,sans-serif;font-weight:600;color:var(--muted)}
.regs{display:flex;flex-wrap:wrap;gap:6px}
.regs .r{padding:5px 10px;border-radius:999px;background:var(--court-soft);color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.regs .r.me{background:var(--court);color:var(--on-court)}
.regs .r.wait{background:var(--surface2);color:var(--muted)}
.regs .r i{font-style:normal;font-size:11px;font-weight:700;opacity:.7}
.me-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.me-bar b{font-weight:600}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.names button{padding:10px 8px;font-weight:500}
.names button.in{background:var(--court-soft);border-color:var(--court)}
.evlist{display:grid;gap:10px}
.evlist .ev{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%;font-weight:500}
.evlist .ev.past{opacity:.6}
.evlist .ev .t{font-family:"Barlow Condensed",Arial,sans-serif;font-size:20px;font-weight:700;line-height:1.1}
.evlist .ev .s{font-size:13px;color:var(--muted)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wa{background:#25D366;border-color:#25D366;color:#fff}

.evt .when span{white-space:nowrap}
form[data-form=guest] button{white-space:nowrap}
.names button.locked{opacity:.5;cursor:not-allowed}
.names button .lk{font-size:12px}
.plist .p{grid-template-columns:1fr auto}

/* stats */
.prob{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.prob b{color:var(--court)}
.upset{font-size:10px;letter-spacing:.08em;font-weight:800;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:2px 6px;margin-top:2px}
.report{border-color:var(--ball);background:linear-gradient(180deg,var(--ball-soft),var(--surface) 70%)}
.hl{display:grid;gap:8px;margin-top:12px}
.hi{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;font-size:15px;line-height:1.35}
.hi span{font-size:22px;line-height:1.2}
.hi b{font-weight:600}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:inherit;text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:pointer;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface2);border-radius:12px;padding:10px 8px;text-align:center;display:grid;gap:2px}
.tile b{font-family:"Barlow Condensed",Arial,sans-serif;font-size:26px;font-weight:700;line-height:1}
.tile span{font-size:11px;color:var(--muted);font-weight:600}
.tile i{font-style:normal;font-size:11px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.badge{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.25}
.badge span{font-size:24px}
.badge small{color:var(--muted)}
@media (max-width:420px){ .tiles{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<header class="top"><div class="wrap">

<script>
(function(){
'use strict';
/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDRx52zEn2rD4CunUnbBGsSvVbbDh-vPEY",
  authDomain: "bkc-h-a19b3.firebaseapp.com",
  databaseURL: "https://bkc-h-a19b3-default-rtdb.firebaseio.com",
  projectId: "bkc-h-a19b3",

  messagingSenderId: "677006429645",
  appId: "1:677006429645:web:b6f37056ea081ebe364884"
};
const ROOT='bkc';
const SEED={players:[{id:"haider",name:"Haider",active:true},{id:"fadil",name:"Fadil",active:true},{id:"ayman",name:"Ayman",active:true},{id:"amr",name:"Amr",active:true},{id:"zuhair",name:"Zuhair",active:true},{id:"abdulrakib",name:"Abdulrakib",active:true},{id:"mostafa",name:"Mostafa",active:true},{id:"ahmed-hussain",name:"Ahmed Hussain",active:true},{id:"ahmed-abdullah",name:"Ahmed Abdullah",active:true},{id:"ahmed-mash",name:"Ahmed Mash",active:true},{id:"majed",name:"Majed",active:true},{id:"muneer",name:"Muneer",active:true},{id:"munned",name:"Munned",active:true},{id:"khalid",name:"Khalid",active:true},{id:"atef",name:"Atef",active:true}],settings:{target:6,pointsTo:11,minutes:120}};

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={players:[],settings:Object.assign({},SEED.settings),sessions:{},events:{},claims:{}};
let mode='pending';   // 'pending' | 'live' | 'offline'
let db=null, rootRef=null;
const ui={tab:'play',setup:null,preview:null,editing:null,confirm:null,ratingsView:'rating',eventId:null,eventForm:null,manual:false,pickMe:false,addMode:false,pin:null,pinErr:false,profile:null,img:null,imgSid:null,imgTitle:'',openSid:null};
try{ const t=sessionStorage.getItem('bkc-tab'); if(t) ui.tab=t; }catch(e){}

readHash(); window.addEventListener('hashchange',()=>{ readHash(); render(); });

/* ---------- helpers ---------- */
const byId=()=>Object.fromEntries(S.players.map(p=>[p.id,p]));
const nameOf=id=>{const p=byId()[id];return p?p.name:id;};
const first=id=>{
  const n=nameOf(id), parts=n.trim().split(/\s+/), f=parts[0];
  const clash=S.players.some(p=>p.id!==id&&p.name.trim().split(/\s+/)[0].toLowerCase()===f.toLowerCase());
  return clash&&parts[1]?f+' '+parts[1][0].toUpperCase()+'.':f;

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtDate=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});};
const slug=n=>n.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'p';
const sortedSessions=()=>Object.values(S.sessions).sort((a,b)=>a.date===b.date?a.id.localeCompare(b.id):a.date.localeCompare(b.date));
const gamesOf=s=>Object.values(s.games||{}).sort((a,b)=>a.n-b.n);
const gid=n=>'g'+String(n).padStart(2,'0');
const fmtTime=t=>{ if(!t) return ''; const [hh,mm]=t.split(':').map(Number); const d=new Date(2000,0,1,hh,mm); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const sortedEvents=()=>Object.values(S.events).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
const upcomingEvents=()=>sortedEvents().filter(e=>e.status!=='closed'&&e.date>=todayISO());
const regList=e=>Object.entries(e.regs||{}).filter(([,r])=>r).sort((a,b)=>(a[1].at||0)-(b[1].at||0)).map(([pid])=>pid);
const eventUrl=e=>location.origin+location.pathname+'#event='+e.id;
let DEVICE=null; try{ DEVICE=localStorage.getItem('bkc-device'); if(!DEVICE){ DEVICE='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('bkc-device',DEVICE); } }catch(e){ DEVICE='tmp'; }

/* ---------- persistence (Firebase Realtime Database) ---------- */
function normalize(raw){
  raw=raw||{};
  const players=Array.isArray(raw.players)?raw.players.filter(Boolean):Object.values(raw.players||{});
  const sessions={};
  Object.entries(raw.sessions||{}).forEach(([id,s])=>{
    if(!s) return;
    const games={};
    Object.entries(s.games||{}).forEach(([k,g])=>{ if(g){ g.id=g.id||k; games[k]=g; } });
    sessions[id]=Object.assign({},s,{id,games,playerIds:Array.isArray(s.playerIds)?s.playerIds.filter(Boolean):Object.values(s.playerIds||{})});
  });
  const events={};
  Object.entries(raw.events||{}).forEach(([id,e])=>{ if(e){ events[id]=Object.assign({},e,{id,regs:e.regs||{}}); } });
  return {players,settings:Object.assign({},SEED.settings,raw.settings||{}),sessions,events,claims:raw.claims||{}};
}
function write(path,value){ // set
  return rootRef.child(path).set(value).catch(err=>{console.error(err);toast('Could not save — check your connection');});
}
function patch(path,obj){ // merge
  return rootRef.child(path).update(obj).catch(err=>{console.error(err);toast('Could not save — check your connection');});
}
function boot(){
  render();
  try{
    firebase.initializeApp(firebaseConfig);
    db=firebase.database(); rootRef=db.ref(ROOT);
  }catch(e){ console.error(e); setBanner('Could not reach the BKC database. Check your connection and reload.'); return; }
  db.ref('.info/connected').on('value',s=>{
    if(s.val()===true){ if(mode!=='pending') mode='live'; setBanner(''); }
    else if(mode!=='pending'){ mode='offline'; }
    renderChip();
  });
  let seeded=false;
  rootRef.on('value',snap=>{
    const raw=snap.val();
    if((!raw||!raw.players)&&!seeded){ seeded=true; rootRef.update({players:SEED.players,settings:SEED.settings}); return; }
    S=normalize(raw);
    if(mode==='pending') mode='live';
    render();
  },err=>{ console.error(err); setBanner('The BKC database refused the connection. Check the Firebase rules allow read and write.'); });
}

/* ---------- schedule generator ---------- */
// ids: present players; total: games to create; prior: games already played this session (for regenerate); startN: first game number
function generateSchedule(ids,total,prior,startN){
  prior=prior||[]; startN=startN||1;
  const n=ids.length; if(n<4||total<=0) return [];
  const idx=Object.fromEntries(ids.map((p,i)=>[p,i]));
  let best=null,bestScore=Infinity;
  const t0=performance.now();
  for(let it=0; it<800 && (it<40 || performance.now()-t0<450); it++){
    const gp=new Array(n).fill(0),last=new Array(n).fill(-99),streak=new Array(n).fill(0),maxStreak=new Array(n).fill(0);
    const part=ids.map(()=>new Array(n).fill(0)),opp=ids.map(()=>new Array(n).fill(0));
    const apply=(a,b,G)=>{
      const all=a.concat(b);
      all.forEach(p=>{gp[p]++;streak[p]=(last[p]===G-1)?streak[p]+1:1;maxStreak[p]=Math.max(maxStreak[p],streak[p]);last[p]=G;});
      [a,b].forEach(t=>{ if(t.length===2){part[t[0]][t[1]]++;part[t[1]][t[0]]++;} });
      a.forEach(x=>b.forEach(y=>{opp[x][y]++;opp[y][x]++;}));
    };
    prior.forEach((g,G)=>apply(g.a.map(p=>idx[p]).filter(x=>x!==undefined),g.b.map(p=>idx[p]).filter(x=>x!==undefined),G));
    const off=prior.length, games=[];
    for(let k=0;k<total;k++){
      const G=off+k;
      const sc=ids.map((_,i)=>({i,s:gp[i]*10-Math.min(G-last[i],8)*1.2+((last[i]===G-1&&streak[i]>=2)?5:0)+Math.random()*3}));
      sc.sort((x,y)=>x.s-y.s);
      const [p,q,r,s]=sc.slice(0,4).map(x=>x.i);
      const splits=[[[p,q],[r,s]],[[p,r],[q,s]],[[p,s],[q,r]]];
      let bs=null,bv=Infinity;
      splits.forEach(([a,b])=>{
        const v=3*(part[a[0]][a[1]]+part[b[0]][b[1]])+(opp[a[0]][b[0]]+opp[a[0]][b[1]]+opp[a[1]][b[0]]+opp[a[1]][b[1]])+Math.random();
        if(v<bv){bv=v;bs=[a,b];}
      });
      games.push(bs); apply(bs[0],bs[1],G);
    }
    let score=0;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){score+=3*part[i][j]*part[i][j]+opp[i][j]*opp[i][j];}
    const mean=gp.reduce((a,b)=>a+b,0)/n;
    score+=6*gp.reduce((a,g)=>a+(g-mean)*(g-mean),0);
    score+=maxStreak.reduce((a,m)=>a+(m>2?4*(m-2):0),0);
    if(score<bestScore){bestScore=score;best=games;}
  }
  return best.map((g,k)=>({id:gid(startN+k),n:startN+k,a:g[0].map(i=>ids[i]),b:g[1].map(i=>ids[i]),sa:null,sb:null,done:false}));
}
function fairness(ids,games){
  const gp={},partners={};
  ids.forEach(p=>{gp[p]=0;});
  let repeats=0;
  games.forEach(g=>{[...g.a,...g.b].forEach(p=>{gp[p]=(gp[p]||0)+1;});
    [g.a,g.b].forEach(t=>{const k=[...t].sort().join('|');partners[k]=(partners[k]||0)+1;if(partners[k]>1)repeats++;});});
  const vals=Object.values(gp);
  return {min:Math.min(...vals),max:Math.max(...vals),repeats,gp};
}

/* ---------- ratings & standings ---------- */
const START=1500;
let _statsCache=null;
function computeRatings(){
  if(_statsCache&&_statsCache.S===S) return _statsCache.v;
  const R={},st={},probs={},sessionInfo={};
  const ensure=p=>{ if(!(p in R)){R[p]=START;st[p]={g:0,w:0,l:0,pf:0,pa:0,hist:[],streak:0,maxStreak:0,peak:START,partners:{},opps:{},sessions:0,mvp:0,perfect:0,giant:0,upsets:0,closeWins:0};} };
  S.players.forEach(p=>ensure(p.id));
  sortedSessions().forEach(s=>{
    const before={};
    (s.playerIds||[]).forEach(ensure);
    Object.keys(R).forEach(p=>before[p]=R[p]);
    const played=new Set();
    gamesOf(s).forEach(g=>{
      if(!g.done||g.void||g.sa==null||g.sb==null||g.sa===g.sb) return;
      const A=g.a,B=g.b; [...A,...B].forEach(ensure);
      const ta=A.reduce((x,p)=>x+R[p],0)/A.length, tb=B.reduce((x,p)=>x+R[p],0)/B.length;
      const eA=1/(1+Math.pow(10,(tb-ta)/400));
      probs[s.id+'/'+g.id]={pA:eA,pB:1-eA,ta,tb};
      const aWon=g.sa>g.sb, margin=Math.abs(g.sa-g.sb);
      const mov=1+0.5*Math.log(1+margin);
      const winnerP=aWon?eA:1-eA;
      const upd=(team,won,e,pf,pa,mates,opp)=>team.forEach(p=>{
        const K=st[p].g<10?40:24;
        R[p]+=K*mov*((won?1:0)-e);
        const t=st[p]; t.g++; won?t.w++:t.l++; t.pf+=pf; t.pa+=pa; played.add(p);
        t.streak=won?(t.streak>0?t.streak+1:1):(t.streak<0?t.streak-1:-1);
        t.maxStreak=Math.max(t.maxStreak,t.streak);
        t.peak=Math.max(t.peak,R[p]);
        if(won&&winnerP<0.35) t.giant++;
        if(won&&winnerP<0.45) t.upsets++;
        if(won&&margin<=2) t.closeWins++;
        mates.forEach(m=>{ if(m!==p){ const pm=t.partners[m]||(t.partners[m]={g:0,w:0}); pm.g++; if(won)pm.w++; } });
        opp.forEach(o=>{ const po=t.opps[o]||(t.opps[o]={g:0,w:0}); po.g++; if(won)po.w++; });
      });
      upd(A,aWon,eA,g.sa,g.sb,A,B); upd(B,!aWon,1-eA,g.sb,g.sa,B,A);
    });
    const ds=dayStandings(s).filter(r=>r.g>0);
    const complete=s.status==='closed'||(gamesOf(s).length&&gamesOf(s).every(g=>g.done));
    const mvp=(complete&&ds.length)?ds[0].id:null;
    if(mvp) st[mvp].mvp++;
    ds.forEach(r=>{ if(r.g>=3&&r.l===0) st[r.id].perfect++; });
    played.forEach(p=>st[p].sessions++);
    sessionInfo[s.id]={mvp,complete,played:[...played],standings:ds};
    (s.playerIds||[]).forEach(p=>st[p].hist.push({sid:s.id,date:s.date,r:R[p],d:R[p]-before[p],played:played.has(p)}));
  });
  const v={R,st,probs,sessionInfo};
  _statsCache={S,v};
  return v;
}
function winProb(sid,gid,a,b){
  const {R,probs}=computeRatings();
  const k=probs[sid+'/'+gid]; if(k) return k.pA;
  const ta=a.reduce((x,p)=>x+(R[p]||START),0)/a.length, tb=b.reduce((x,p)=>x+(R[p]||START),0)/b.length;
  return 1/(1+Math.pow(10,(tb-ta)/400));
}
/* --- season points --- */
function seasonCfg(){ const s=S.settings.season||{}; const first=sortedSessions()[0]; return {name:s.name||'Season 1',start:s.start||(first?first.date:todayISO())}; }
function seasonTable(){
  const {sessionInfo}=computeRatings(); const cfg=seasonCfg(); const t={};
  sortedSessions().filter(s=>s.date>=cfg.start).forEach(s=>{
    const info=sessionInfo[s.id]; if(!info) return;
    info.standings.forEach(r=>{ const x=t[r.id]||(t[r.id]={id:r.id,pts:0,sessions:0,w:0,l:0,mvp:0}); x.sessions++; x.pts+=3+r.w; x.w+=r.w; x.l+=r.l; if(info.mvp===r.id){x.pts+=2;x.mvp++;} });
  });
  return Object.values(t).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.l-b.l||nameOf(a.id).localeCompare(nameOf(b.id)));
}
/* --- highlights for a session --- */
function sessionHighlights(s){
  const {probs,sessionInfo,st}=computeRatings();
  const info=sessionInfo[s.id]||{standings:dayStandings(s).filter(r=>r.g>0)};
  const games=gamesOf(s).filter(g=>g.done&&!g.void&&g.sa!=null&&g.sb!=null&&g.sa!==g.sb);
  let closest=null,upset=null;
  games.forEach(g=>{
    const margin=Math.abs(g.sa-g.sb), total=g.sa+g.sb;
    if(!closest||margin<closest.margin||(margin===closest.margin&&total>closest.total)) closest={g,margin,total};
    const pr=probs[s.id+'/'+g.id]; if(pr){ const wp=g.sa>g.sb?pr.pA:pr.pB; if(wp<0.5&&(!upset||wp<upset.wp)) upset={g,wp}; }
  });
  const pairs={};
  games.forEach(g=>{ const aWon=g.sa>g.sb; [[g.a,aWon],[g.b,!aWon]].forEach(([t,won])=>{ const k=[...t].sort().join('|'); const x=pairs[k]||(pairs[k]={k,g:0,w:0,pf:0,pa:0}); x.g++; if(won)x.w++; }); });
  const bestPair=Object.values(pairs).filter(p=>p.g>=2&&p.w>=2&&p.w/p.g>0.5).sort((a,b)=>(b.w/b.g)-(a.w/a.g)||b.w-a.w)[0]||null;
  const movers=(s.playerIds||[]).map(p=>{ const h=(st[p]&&st[p].hist.find(x=>x.sid===s.id)); return {id:p,d:h?h.d:0}; }).filter(x=>x.d!==0).sort((a,b)=>b.d-a.d);
  return {standings:info.standings,mvp:info.mvp||(info.standings[0]&&info.standings[0].id)||null,closest,upset,bestPair,movers,games:games.length};
}
function reportText(s){
  const h=sessionHighlights(s); const L=[];
  L.push('🏓 BKC — '+fmtDate(s.date)); L.push(h.games+' games · '+(s.playerIds||[]).length+' players'); L.push('');
  L.push('🏆 Standings');
  h.standings.slice(0,8).forEach((r,i)=>L.push((i+1)+'. '+first(r.id)+' '+r.w+'–'+r.l+' ('+(r.pf-r.pa>0?'+':'')+(r.pf-r.pa)+')'));
  if(h.mvp) L.push('', '⭐ Day MVP: '+nameOf(h.mvp));
  if(h.closest) L.push('🔥 Closest game: '+teamTxt(h.closest.g.a)+' '+h.closest.g.sa+'–'+h.closest.g.sb+' '+teamTxt(h.closest.g.b));
  if(h.upset){ const g=h.upset.g, w=g.sa>g.sb?g.a:g.b, l=g.sa>g.sb?g.b:g.a; L.push('😱 Upset of the day: '+teamTxt(w)+' beat '+teamTxt(l)+' '+Math.max(g.sa,g.sb)+'–'+Math.min(g.sa,g.sb)+' ('+Math.round(h.upset.wp*100)+'% chance)'); }
  if(h.bestPair){ const [p,q]=h.bestPair.k.split('|'); L.push('🤝 Best pair: '+first(p)+' & '+first(q)+' '+h.bestPair.w+'–'+(h.bestPair.g-h.bestPair.w)); }
  if(h.movers.length){ const up=h.movers.filter(x=>x.d>0).slice(0,3), dn=h.movers.filter(x=>x.d<0).slice(-2);
    L.push('', '📈 Rating movers: '+up.map(x=>first(x.id)+' +'+Math.round(x.d)).join(', ')+(dn.length?' · '+dn.map(x=>first(x.id)+' '+Math.round(x.d)).join(', '):'')); }
  L.push('', 'Full stats: '+location.origin+location.pathname);
  return L.join('\n');
}
const teamTxt=t=>t.map(first).join(' & ');
function reminderText(e){

/* --- badges --- */
function badgesFor(pid){
  const {st}=computeRatings(); const t=st[pid]; if(!t) return [];
  const B=[];
  if(t.g>=100) B.push(['💯','Centurion','100 games']); else if(t.g>=50) B.push(['🎯','Regular','50 games']); else if(t.g>=25) B.push(['🏓','Committed','25 games']); else if(t.g>=10) B.push(['✅','Rated','10 games — rating settled']);
  if(t.mvp>=1) B.push(['⭐','Day MVP','×'+t.mvp]);
  if(t.perfect>=1) B.push(['🧹','Perfect day','Unbeaten in a session ×'+t.perfect]);
  if(t.giant>=1) B.push(['🗡️','Giant slayer','Beat a heavy favourite ×'+t.giant]);
  if(t.maxStreak>=5) B.push(['🔥','Hot streak',t.maxStreak+' wins in a row']);
  if(t.closeWins>=3) B.push(['🧊','Ice in the veins',t.closeWins+' wins by 2 or less']);
  // iron man: attended every session in the last 5 sessions (min 3)
  const last=sortedSessions().filter(s=>s.status==='closed').slice(-5);
  if(last.length>=3&&last.every(s=>t.hist.some(h=>h.sid===s.id&&h.played))) B.push(['🦾','Iron man','Every one of the last '+last.length+' sessions']);
  if(t.peak>=1600) B.push(['🚀','1600 club','Peak rating '+Math.round(t.peak)]);
  return B;
}
function dayStandings(s){
  const t={};
  (s.playerIds||[]).forEach(p=>t[p]={id:p,g:0,w:0,l:0,pf:0,pa:0});
  gamesOf(s).forEach(g=>{
    if(!g.done||g.void||g.sa==null||g.sb==null) return;
    const aWon=g.sa>g.sb;
    g.a.forEach(p=>{const r=t[p]||(t[p]={id:p,g:0,w:0,l:0,pf:0,pa:0});r.g++;aWon?r.w++:r.l++;r.pf+=g.sa;r.pa+=g.sb;});
    g.b.forEach(p=>{const r=t[p]||(t[p]={id:p,g:0,w:0,l:0,pf:0,pa:0});r.g++;aWon?r.l++:r.w++;r.pf+=g.sb;r.pa+=g.sa;});
  });
  return Object.values(t).sort((x,y)=>(y.w-x.w)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf)||nameOf(x.id).localeCompare(nameOf(y.id)));
}
function spark(hist){
  if(!hist||hist.length<2) return '';
  const vals=hist.map(h=>h.r), min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*60+2,18-((v-min)/span)*14]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const e=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 64 20" aria-hidden="true"><path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="2" fill="currentColor"/></svg>';
}

  }

}
function viewSetup(){

  }
  const u=ui.setup;
  const sel=new Set(u.sel);

    +'<label class="field" style="width:150px">Games per player<select data-setup="target">'+[4,5,6,7,8].map(v=>'<option value="'+v+'"'+(v===u.target?' selected':'')+'>'+v+'</option>').join('')+'</select></label></div>';
  h+='<div class="row between"><span class="muted small">'+n+' selected</span><span class="row"><button class="sm ghost" data-act="sel-all">All</button><button class="sm ghost" data-act="sel-none">None</button></span></div>';
  h+='<div class="pick">'+S.players.filter(p=>p.active!==false||sel.has(p.id)).map(p=>'<label><input type="checkbox" data-pick="'+p.id+'"'+(sel.has(p.id)?' checked':'')+'>'+esc(p.name)+'</label>').join('')+'</div>';
  if(n>=4){
    h+='<p class="small muted" style="margin:4px 0 0">'+total+' games on one court · about '+perGame+' min each in '+(S.settings.minutes||120)+' minutes'+(perGame<7?' — tight; consider fewer games per player':'')+'</p>';
  }else h+='<p class="small muted" style="margin:4px 0 0">Pick at least 4 players.</p>';
  h+='<div class="actions"><button class="primary grow" data-act="gen" '+(n<4?'disabled':'')+'>Build the schedule</button></div>';
  h+='</div></section>';
  if(ui.preview&&ui.preview.games.length){
    const pv=ui.preview, f=fairness(pv.ids,pv.games);
    h+='<section class="card"><div class="row between"><h2>Schedule preview</h2><button class="sm" data-act="gen">Shuffle</button></div>';
    h+='<p class="small muted" style="margin:6px 0 12px">'+pv.games.length+' games · everyone plays '+(f.min===f.max?f.min:f.min+'–'+f.max)+' · '+(f.repeats?f.repeats+' repeated partner pair'+(f.repeats>1?'s':''):'no repeated partners')+'</p>';
    h+='<div class="stack" style="gap:6px">'+pv.games.map(g=>gameRow(g,pv.ids,false)).join('')+'</div>';
    h+='<div class="actions" style="margin-top:14px"><button class="accent grow" data-act="start" '+(canWrite()?'':'disabled')+'>Start session</button></div></section>';
  }
  return h;
}
function teamHTML(t,cls){return '<span class="team '+(cls||'')+'">'+t.map(p=>esc(first(p))).join(' <span class="muted">&amp;</span> ')+'</span>';}
function gameRow(g,ids,live,sid){
  const sit=ids.filter(p=>!g.a.includes(p)&&!g.b.includes(p));
  const aWon=g.done&&g.sa>g.sb, bWon=g.done&&g.sb>g.sa;
  let cls='game'+(g.done?' done':'')+(g.void?' void':'')+(g.next?' next':'');
  let score, pTag='';
  if(sid&&!g.void){
    const pA=winProb(sid,g.id,g.a,g.b);
    if(g.done&&g.sa!=null&&g.sb!=null&&g.sa!==g.sb){ const wp=aWon?pA:1-pA; if(wp<0.4) pTag='<span class="upset">UPSET</span>'; }
    else if(!g.done) pTag='<span class="prob"><b>'+Math.round(pA*100)+'%</b> · '+Math.round((1-pA)*100)+'%</span>';
  }
  if(g.void) score='<span class="small muted">skipped</span>';
  else if(g.done) score='<span class="num">'+g.sa+'–'+g.sb+'</span>'+pTag;
  else score=(live?'<span class="enter">'+(g.next?'Enter score':'Score')+'</span>':'')+pTag;
  const tag=live?'button':'div';
  let h='<'+tag+' class="'+cls+'" '+(live?'data-game="'+g.id+'"':'')+'>'
    +'<span class="n num">'+g.n+'</span>'
    +'<span class="teams">'+teamHTML(g.a,aWon?'win':(bWon?'lose':''))+'<span class="vs">vs</span>'+teamHTML(g.b,bWon?'win':(aWon?'lose':''))+'</span>'
    +'<span class="score">'+score+'</span></'+tag+'>';
  if(sit.length&&!g.done) h+='<div class="sit">Sitting: <b>'+sit.map(p=>esc(first(p))).join(', ')+'</b></div>';
  return h;
}
function viewSession(s){
  const games=gamesOf(s), ids=s.playerIds;
  const played=games.filter(g=>g.done).length, live=games.filter(g=>!g.void).length;
  const nextG=games.find(g=>!g.done&&!g.void);
  const rows=games.map(g=>Object.assign({},g,{next:nextG&&g.id===nextG.id}));
  let h='<section class="card">';
  h+='<div class="row between"><div><div class="eyebrow">Today · '+fmtDate(s.date)+'</div><h2 style="margin-top:2px">'+played+' of '+live+' games played</h2></div>'
    +'<span class="chip" style="background:var(--surface2);color:var(--muted)">'+ids.length+' players</span></div>';
  h+='<div class="progress" style="margin:12px 0 4px"><i style="width:'+(live?Math.round(played/live*100):0)+'%"></i></div>';
  if(played===0) h+='<div class="actions" style="margin-top:12px"><button class="sm" data-act="lineup-img" data-sid="'+s.id+'">Line-up card</button></div>';

    h+='<div class="scroll"><table class="tbl" style="margin-top:8px"><thead><tr><th>#</th><th class="l">Player</th><th>W–L</th><th>+/−</th><th>Pts</th></tr></thead><tbody>';
    st.forEach((r,i)=>{const d=r.pf-r.pa;h+='<tr><td class="rank">'+(i+1)+'</td><td class="l name">'+esc(nameOf(r.id))+(i===0&&played===live&&live>0?'<span class="tag mvp">Day MVP</span>':'')+'</td><td class="num">'+r.w+'–'+r.l+'</td><td class="'+(d>0?'up':d<0?'down':'')+'">'+(d>0?'+':'')+d+'</td><td class="muted">'+r.pf+'</td></tr>';});
    h+='</tbody></table></div></section>';
  }
  h+='<section class="card flat"><div class="row between" style="padding:0 2px 8px"><h3>Games</h3>'+(canWrite()&&isAdmin()?'<button class="sm ghost" data-act="regen" title="Rebuild the games not yet played">Regenerate remaining</button>':'')+'</div>';
  h+='<div class="stack" style="gap:6px">'+rows.map(g=>gameRow(g,ids,canWrite(),s.id)).join('')+'</div></section>';
  if(canWrite()&&!isAdmin()) h+='<section class="card"><div class="row between"><span class="small muted">Tap any game to enter its score. Organizer tools are locked.</span>'+unlockBtn()+'</div></section>';
  if(canWrite()&&isAdmin()){
    h+='<section class="card"><div class="actions">'
      +'<button class="grow" data-act="add-game">Add a game</button>'
      +'<button class="grow" data-act="edit-players">Change players</button>'
      +'<button class="primary grow" data-act="finish">'+(played===live?'Finish session':'Finish early')+'</button></div>';
    if(ui.confirm==='finish') h+='<p class="small" style="margin:12px 0 0">Finish and lock this session? Unplayed games will be dropped. <button class="sm accent" data-act="finish-yes">Yes, finish</button> <button class="sm ghost" data-act="cancel">Cancel</button></p>';
    if(ui.confirm==='regen') h+='<p class="small" style="margin:12px 0 0">Rebuild all games that have not been played yet? Played games stay. <button class="sm accent" data-act="regen-yes">Rebuild</button> <button class="sm ghost" data-act="cancel">Cancel</button></p>';
    if(ui.confirm==='players'){
      const sel=new Set(ui.setup?ui.setup.sel:ids);
      h+='<div style="margin-top:12px"><p class="small muted" style="margin:0 0 8px">Tick who is here now. Games already played are kept; the rest are rebuilt for this group.</p><div class="pick">'
        +S.players.filter(p=>p.active!==false||sel.has(p.id)).map(p=>'<label><input type="checkbox" data-pick="'+p.id+'"'+(sel.has(p.id)?' checked':'')+'>'+esc(p.name)+'</label>').join('')
        +'</div><div class="actions" style="margin-top:10px"><button class="accent" data-act="players-yes">Apply and rebuild</button><button class="ghost" data-act="cancel">Cancel</button></div></div>';
    }
    h+='</section>';
  }
  return h;
}

/* --- Match report --- */
function reportBlock(s){
  const h=sessionHighlights(s); if(!h.games) return '';
  let x='<section class="card report"><div class="row between"><div><div class="eyebrow">Match report</div><h3>'+fmtDate(s.date)+'</h3></div><span class="chip" style="background:var(--surface2);color:var(--muted)">'+h.games+' games</span></div>';
  x+='<div class="hl">';
  if(h.mvp) x+='<div class="hi"><span>⭐</span><div><b>Day MVP</b><br>'+esc(nameOf(h.mvp))+'</div></div>';
  if(h.closest) x+='<div class="hi"><span>🔥</span><div><b>Closest game</b><br>'+esc(teamTxt(h.closest.g.a))+' <span class="num">'+h.closest.g.sa+'–'+h.closest.g.sb+'</span> '+esc(teamTxt(h.closest.g.b))+'</div></div>';
  if(h.upset){ const g=h.upset.g, w=g.sa>g.sb?g.a:g.b, l=g.sa>g.sb?g.b:g.a; x+='<div class="hi"><span>😱</span><div><b>Upset of the day</b><br>'+esc(teamTxt(w))+' beat '+esc(teamTxt(l))+' <span class="num">'+Math.max(g.sa,g.sb)+'–'+Math.min(g.sa,g.sb)+'</span> <span class="muted small">('+Math.round(h.upset.wp*100)+'% chance)</span></div></div>'; }
  if(h.bestPair){ const [p,q]=h.bestPair.k.split('|'); x+='<div class="hi"><span>🤝</span><div><b>Best pair</b><br>'+esc(first(p))+' &amp; '+esc(first(q))+' <span class="num">'+h.bestPair.w+'–'+(h.bestPair.g-h.bestPair.w)+'</span></div></div>'; }
  if(h.movers.length){ const up=h.movers.filter(m=>m.d>0).slice(0,3); x+='<div class="hi"><span>📈</span><div><b>Rating movers</b><br>'+up.map(m=>esc(first(m.id))+' <span class="up">+'+Math.round(m.d)+'</span>').join(' · ')+'</div></div>'; }
  x+='</div>';
  x+='<div class="actions" style="margin-top:12px"><a class="wa" style="text-decoration:none;display:inline-flex;align-items:center;padding:9px 14px;border-radius:10px;font-weight:600" href="https://wa.me/?text='+encodeURIComponent(reportText(s))+'" target="_blank" rel="noopener">Share on WhatsApp</a>'
    +'<button data-act="report-img" data-sid="'+s.id+'">Report card image</button><button class="ghost" data-act="copy-report" data-sid="'+s.id+'">Copy text</button></div>';
  x+='</section>';
  return x;
}
/* --- Events --- */

/* --- score sheet --- */
function viewSheet(){
  const e=ui.editing, s=S.sessions[e.sid], g=s.games[e.gid];
  const to=S.settings.pointsTo||11;
  const a=e.sa, b=e.sb;
  const valid=a!==b&&(Math.max(a,b)>=to)&&Math.abs(a-b)>=2;
  let hint='';
  if(a===b) hint='Scores are tied — pick a winner.';
  else if(Math.max(a,b)<to) hint='Games go to '+to+' — save anyway if you stopped early.';
  else if(Math.abs(a-b)<2) hint='Win by 2 — check the score.';
  const side=(team,val,key,won)=>'<div class="side'+(won?' win':'')+'"><div class="who">'+team.map(p=>esc(nameOf(p))).join('<br>')+'</div>'
    +'<div class="val num">'+val+'</div><div class="ctl"><button data-inc="'+key+':-1" aria-label="minus one">−</button><button data-inc="'+key+':1" aria-label="plus one">+</button></div>'
    +'<div class="quick">'+[to,to+2,to+4].map(v=>'<button class="sm" data-set="'+key+':'+v+'">'+v+'</button>').join('')+'</div></div>';
  let h='<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-label="Enter score">';
  h+='<div class="row between"><div><div class="eyebrow">Game '+g.n+'</div><h2>Score</h2></div><button class="ghost sm" data-act="close">Close</button></div>';
  h+='<div class="scorepad">'+side(g.a,a,'a',a>b&&valid)+side(g.b,b,'b',b>a&&valid)+'</div>';
  h+='<div class="hint">'+hint+'</div>';
  h+='<div class="actions" style="margin-top:10px"><button class="primary grow" data-act="save-score" '+(a===b?'disabled':'')+'>Save result</button>'
    +(g.done?'<button data-act="clear-score">Clear</button>':'')
    +'<button class="ghost" data-act="void-game">'+(g.void?'Restore':'Skip game')+'</button></div>';
  h+='</div></div>';
  return h;
}
/* --- Ratings tab --- */
function viewRatings(){
  const {R,st}=computeRatings();
  const rows=S.players.map(p=>({id:p.id,name:p.name,r:R[p.id],s:st[p.id]})).filter(x=>x.s.g>0||x.s.hist.length>0);
  let h='<section class="card"><div class="row between"><div><div class="eyebrow">All time</div><h2>Ratings</h2></div>'
    +'<span class="row" style="gap:4px"><button class="sm '+(ui.ratingsView==='rating'?'primary':'ghost')+'" data-rv="rating">Rating</button><button class="sm '+(ui.ratingsView==='record'?'primary':'ghost')+'" data-rv="record">Record</button><button class="sm '+(ui.ratingsView==='season'?'primary':'ghost')+'" data-rv="season">Season</button></span></div>';
  if(ui.ratingsView==='season') return h+seasonView()+'</section>'+ratingsLegend();
  if(!rows.length){ h+='<div class="empty">No games recorded yet. Ratings appear after your first session.</div></section>'; return h+ratingsLegend(); }
  rows.sort((x,y)=>ui.ratingsView==='rating'?(y.r-x.r):((y.s.w/(y.s.g||1))-(x.s.w/(x.s.g||1))||(y.s.w-x.s.w)));
  h+='<div class="scroll"><table class="tbl" style="margin-top:10px"><thead><tr><th>#</th><th class="l">Player</th>';
  if(ui.ratingsView==='rating') h+='<th>Rating</th><th>Last</th><th>Trend</th><th>W–L</th>';
  else h+='<th>W–L</th><th>Win%</th><th>+/− per game</th><th>Streak</th>';
  h+='</tr></thead><tbody>';
  rows.forEach((x,i)=>{
    const s=x.s, last=s.hist.length?s.hist[s.hist.length-1].d:0;
    const prov=s.g<10?'<span class="tag" title="Fewer than 10 games — rating still settling">new</span>':'';
    h+='<tr><td class="rank">'+(i+1)+'</td><td class="l name"><button class="linkbtn" data-act="profile" data-pid="'+x.id+'">'+esc(x.name)+'</button>'+prov+'</td>';
    if(ui.ratingsView==='rating'){
      h+='<td class="big">'+Math.round(x.r)+'</td><td class="delta '+(last>0?'up':last<0?'down':'muted')+'">'+(last>0?'+':'')+Math.round(last)+'</td><td>'+spark(s.hist)+'</td><td class="muted">'+s.w+'–'+s.l+'</td>';
    }else{
      const d=s.g?((s.pf-s.pa)/s.g):0;
      h+='<td class="big">'+s.w+'–'+s.l+'</td><td>'+(s.g?Math.round(100*s.w/s.g):0)+'%</td><td class="'+(d>0?'up':d<0?'down':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</td><td class="'+(s.streak>0?'up':s.streak<0?'down':'')+'">'+(s.streak>0?'W'+s.streak:s.streak<0?'L'+(-s.streak):'—')+'</td>';
    }
    h+='</tr>';
  });
  h+='</tbody></table></div></section>';
  // best partnerships
  const pairs={};
  rows.forEach(x=>Object.entries(x.s.partners).forEach(([m,v])=>{const k=[x.id,m].sort().join('|');pairs[k]=v;}));
  const top=Object.entries(pairs).filter(([,v])=>v.g>=3).sort((a,b)=>(b[1].w/b[1].g)-(a[1].w/a[1].g)||b[1].g-a[1].g).slice(0,5);
  if(top.length){
    h+='<section class="card"><h3>Best partnerships</h3><p class="small muted" style="margin:2px 0 8px">Pairs with at least 3 games together</p><table class="tbl"><tbody>';
    top.forEach(([k,v])=>{const [p,q]=k.split('|');h+='<tr><td class="l name">'+esc(first(p))+' &amp; '+esc(first(q))+'</td><td class="num">'+v.w+'–'+(v.g-v.w)+'</td><td>'+Math.round(100*v.w/v.g)+'%</td></tr>';});
    h+='</tbody></table></section>';
  }
  return h+ratingsLegend();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ui.tab=tab.dataset.tab;ui.confirm=null;ui.addMode=false;ui.pickMe=false; if(ui.tab==='events'){ui.eventId=null;ui.eventForm=null; if(location.hash) history.replaceState(null,'',location.pathname+location.search);}try{sessionStorage.setItem('bkc-tab',ui.tab);}catch(x){};render();return;}
  const rv=e.target.closest('[data-rv]'); if(rv){ui.ratingsView=rv.dataset.rv;render();return;}
  const gm=e.target.closest('[data-game]'); if(gm){ const s=currentSession(); if(!s) return; const g=s.games[gm.dataset.game]; if(!g) return; ui.editing={sid:s.id,gid:g.id,sa:g.sa==null?0:g.sa,sb:g.sb==null?0:g.sb}; render(); return; }
  const inc=e.target.closest('[data-inc]'); if(inc){ const [k,d]=inc.dataset.inc.split(':'); const key='s'+k; ui.editing[key]=Math.max(0,Math.min(40,ui.editing[key]+Number(d))); render(); return; }
  const set=e.target.closest('[data-set]'); if(set){ const [k,v]=set.dataset.set.split(':'); ui.editing['s'+k]=Number(v); render(); return; }
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  if(btn.dataset.act==='close-bg'&&e.target!==btn) return;
  handle(btn.dataset.act,btn);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.setup){ if(t.dataset.setup==='date') ui.setup.date=t.value; else ui.setup.target=Number(t.value); ui.preview=null; render(); return; }
  if(t.dataset.pick){ if(!ui.setup){ const cs=currentSession(); ui.setup={sel:cs?cs.playerIds.slice():[]}; } const list=ui.setup.sel; const i=list.indexOf(t.dataset.pick); if(t.checked&&i<0) list.push(t.dataset.pick); if(!t.checked&&i>=0) list.splice(i,1); ui.preview=null; render(); return; }
  if(t.dataset.rename!==undefined){ if(!isAdmin()) return; const p=byId()[t.dataset.rename]; const v=t.value.trim(); if(p&&v&&v!==p.name){ p.name=v; write('players',S.players); toast('Renamed'); } else render(); return; }
  if(t.dataset.setting){ if(!isAdmin()) return; const v=Number(t.value); if(v>0){ patch('settings',{[t.dataset.setting]:v}); toast('Saved'); } return; }
});
document.addEventListener('submit',e=>{
  const pf=e.target.closest('[data-form="pin"]');
  if(pf){ e.preventDefault(); const v=pf.pin.value.trim(); if(String(v)===String(S.settings.adminPin)){ setAdmin(v); ui.pin=null; ui.pinErr=false; render(); toast('Unlocked as organizer'); } else { ui.pinErr=true; render(); } return; }
  const ps=e.target.closest('[data-form="pin-set"]');
  if(ps){ e.preventDefault(); const v=ps.pin.value.trim(); if(!/^\d{4,6}$/.test(v)){ toast('Use 4 to 6 digits'); return; } if(pinSet()&&!isAdmin()) return; setAdmin(v); patch('settings',{adminPin:v}); render(); toast('Organizer PIN saved'); return; }
  const sf=e.target.closest('[data-form="season"]');
  if(sf){ e.preventDefault(); if(!isAdmin()) return; const name=sf.name.value.trim()||'Season 1', start=sf.start.value||todayISO(); patch('settings',{season:{name,start}}); toast('Season saved'); return; }
  const gf=e.target.closest('[data-form="guest"]');
  if(gf){ e.preventDefault(); const name=gf.name.value.trim(); if(!name) return;

    F(500,44,body); x.fillStyle='#16201B'; x.fillText(it[0],70,y+62);
    F(700,24,body); x.fillStyle='#62716A'; x.fillText(it[1].toUpperCase(),140,y+38);
    F(500,30,body); x.fillStyle='#16201B'; x.fillText(fit(x,it[2],W-96-120),140,y+76);
    y+=108;
  });
  F(500,24,body); x.fillStyle='#62716A'; x.textAlign='center'; x.fillText(location.host+location.pathname,W/2,H-28); x.textAlign='left';
  return c.toDataURL('image/png');
}
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function fit(x,t,w){ if(x.measureText(t).width<=w) return t; while(t.length>3&&x.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…'; }
async function shareImage(){
  if(!ui.img) return;
  try{
    const blob=await (await fetch(ui.img)).blob();
    const file=new File([blob],(ui.imgSid?'bkc-report':'bkc-lineup')+'.png',{type:'image/png'});
    const s2=S.sessions[ui.imgSid];
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:ui.imgTitle||'BKC',text:s2?reportText(s2):''}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  toast('Long-press the image to save it, then send it in WhatsApp');
}
function rebuildRemaining(s,ids){
  const games=gamesOf(s), played=games.filter(g=>g.done&&!g.void);
  const target=s.target||S.settings.target||6;
  const counts={}; ids.forEach(p=>counts[p]=0); played.forEach(g=>[...g.a,...g.b].forEach(p=>{ if(p in counts) counts[p]++; }));
  const deficit=ids.reduce((a,p)=>a+Math.max(0,target-counts[p]),0);
  const remaining=Math.max(1,Math.round(deficit/4));
  const keep={}; games.filter(g=>g.done).forEach(g=>keep[g.id]=g);
  const startN=games.filter(g=>g.done).length?Math.max(...games.filter(g=>g.done).map(g=>g.n))+1:1;
  const fresh=generateSchedule(ids,remaining,played,startN);
  fresh.forEach(g=>keep[g.id]=g);
  ui.confirm=null; ui.setup=null;
  patch('sessions/'+s.id,{games:keep,playerIds:ids}); toast('Schedule rebuilt');
}
boot();
})();
